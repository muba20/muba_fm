<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico">
  <title>mubaFM — Premium Ethiopian & Islamic Live Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel='manifest' href='data:application/manifest+json,{"name":"mubaFM","short_name":"mubaFM","start_url":".","display":"standalone","background_color":"#08070c","theme_color":"#08070c","icons":[{"src":"https://via.placeholder.com/192x192/000000/ffffff?text=FM","sizes":"192x192","type":"image/png"}] }'>
  <meta name="theme-color" content="#08070c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mubaFM">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-gradient">muba</span><span>FM</span>
      </div>
      <div class="topbar-center" aria-hidden="true">
        <div class="status-wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="install-button" class="install-btn hidden" type="button">Install App</button>
        <div class="signal-shell">
          <span class="signal-label">Net</span>
          <div class="signal-bars" id="network-strength">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </header>

    <main class="app-grid">
      <section class="panel panel-left">
        <article class="glass-card now-playing-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Now Playing</p>
              <h1 id="now-title">Choose a station</h1>
            </div>
            <div class="pill live-pill hidden" id="live-pill"><span class="live-dot"></span>LIVE</div>
          </div>
          <div class="avatar-shell">
            <div id="now-avatar" class="radio-avatar radio-pulse idle">
              <span class="radio-ring"></span>
              <span class="radio-ring"></span>
              <span class="radio-ring"></span>
              <span class="radio-ring"></span>
              <span class="radio-center"></span>
            </div>
          </div>
          <div class="station-meta">
            <span class="badge" id="now-category">Premium Radio</span>
            <span class="badge badge-soft" id="now-frequency">—</span>
          </div>
          <div class="waveform waveform-large hidden" id="now-waveform">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="control-row">
            <button id="btn-prev" class="control-btn small-btn" type="button" aria-label="Previous station">‹</button>
            <button id="btn-play" class="control-btn play-btn" type="button" aria-label="Play / pause">▶</button>
            <button id="btn-next" class="control-btn small-btn" type="button" aria-label="Next station">›</button>
          </div>
          <div class="volume-panel">
            <div class="volume-label"><span class="volume-icon" id="volume-icon">🔊</span><span>Volume</span></div>
            <div class="volume-slider">
              <input id="volume-control" type="range" min="0" max="1" step="0.01" value="0.75">
              <span id="volume-value">75%</span>
            </div>
          </div>
          <div class="sleep-panel">
            <div class="sleep-header">
              <span class="sleep-icon">🌙</span>
              <span class="sleep-label">Sleep Timer</span>
              <span class="sleep-status" id="sleep-status">Off</span>
            </div>
            <div class="sleep-presets" id="sleep-presets">
              <button class="sleep-preset" data-mins="15" type="button">15m</button>
              <button class="sleep-preset" data-mins="30" type="button">30m</button>
              <button class="sleep-preset" data-mins="60" type="button">1h</button>
              <button class="sleep-preset" data-mins="90" type="button">1.5h</button>
              <button class="sleep-preset active" data-mins="0" type="button">Off</button>
            </div>
            <div class="sleep-countdown-bar hidden" id="sleep-bar">
              <div class="sleep-bar-fill" id="sleep-bar-fill"></div>
              <span class="sleep-time-left" id="sleep-time-left">00:00</span>
            </div>
          </div>
          <div class="status-line">
            <p id="player-status">Ready for premium sound.</p>
          </div>
        </article>
      </section>

      <section class="panel panel-right">
        <article class="glass-card station-browser-card">
          <div class="browser-header">
            <div>
              <p class="eyebrow">Stations</p>
              <h2>Curated Live Radio</h2>
            </div>
            <div class="count-pill"><span id="station-count">0</span> stations</div>
          </div>
          <div class="search-row">
            <label class="search-input-shell">
              <span class="search-icon">🔍</span>
              <input id="search-input" type="search" placeholder="Search stations..." autocomplete="off">
            </label>
            <button id="favorites-toggle" class="icon-button" type="button" aria-pressed="false" title="Show favorites only">★</button>
          </div>
          <div class="tabs" id="category-tabs">
            <button class="tab active" data-category="All" type="button">All</button>
            <button class="tab" data-category="Ethiopian Radio" type="button">🇪🇹 Ethiopian</button>
            <button class="tab" data-category="Music Channels" type="button">🎵 Music</button>
            <button class="tab" data-category="Islamic / Quran" type="button">🕌 Quran</button>
          </div>
          <div class="station-groups" id="station-groups"></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <span>Made with</span>
      <span class="heart">❤️</span>
      <span>by muba</span>
    </footer>
  </div>

  <audio id="main-player" preload="none"></audio>
  <script src="index.js"></script>
</body>
</html>
